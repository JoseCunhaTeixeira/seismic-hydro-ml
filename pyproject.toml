[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seismic-hydro-ml"
version = "1.0.0"
description = "Predicting groundwater table level maps from seismic surface-wave dispersion curves with a Multilayer Perceptron."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jose Cunha Teixeira", email = "jose.cunha-teixeira@protonmail.com" },
]
keywords = [
    "groundwater",
    "hydrology",
    "seismic",
    "surface waves",
    "dispersion curves",
    "machine learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "tensorflow>=2.16",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/JoseCunhaTeixeira/seismic-hydro-ml"
Repository = "https://github.com/JoseCunhaTeixeira/seismic-hydro-ml"
Paper = "https://doi.org/10.1029/2024WR037706"

[project.scripts]
shml-prepare-data = "seismic_hydro_ml.data_prep:main"
shml-train = "seismic_hydro_ml.train:main"
shml-evaluate = "seismic_hydro_ml.evaluate:main"
shml-build-maps = "seismic_hydro_ml.build_maps:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
